name: Add Moving Head from Issue

on:
  issues:
    types: [opened, reopened]

jobs:
  add-moving-head:
    # Only run on issues whose title contains "New Moving Head:"
    if: contains(github.event.issue.title, 'New Moving Head:')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit back to the repo
      issues: write     # to comment on the issue

    steps:
      - uses: actions/checkout@v7

      - name: Extract and append moving head
        id: merge
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'EOF'
          import json, re, os, sys

          body = os.environ.get("ISSUE_BODY", "")

          # Pull the first JSON code block out of the issue body
          match = re.search(r'```(?:json)?\s*(\{.*?\})\s*```', body, re.DOTALL)
          if not match:
              print("::error::No JSON block found in issue body.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("status=no_json\n")
              sys.exit(1)

          try:
              entry = json.loads(match.group(1))
          except json.JSONDecodeError as e:
              print(f"::error::Could not parse JSON: {e}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("status=bad_json\n")
              sys.exit(1)

          name = entry.get("name", "").strip()
          if not name:
              print("::error::JSON block has no 'name' field.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("status=no_name\n")
              sys.exit(1)

          # ── Update moving_heads_channel_types.json ──────────────────────────
          with open("moving_heads_channel_types.json", encoding="utf-8") as f:
              data = json.load(f)

          existing = {mh["name"].lower() for mh in data.get("moving_heads", [])}

          if name.lower() in existing:
              print(f"'{name}' already exists — nothing to do.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("status=duplicate\n")
                  f.write(f"name={name}\n")
              sys.exit(0)

          data["moving_heads"].append(entry)

          with open("moving_heads_channel_types.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          # ── Update BUILTIN_PRESETS in xmodel-builder.html ───────────────────
          def sq(s):
              return "'" + str(s).replace("\\", "\\\\").replace("'", "\\'") + "'"

          def motor(m):
              parts = [
                  f"min_limit:{m['min_limit']}",
                  f"max_limit:{m['max_limit']}",
                  f"range_of_motion:{m['range_of_motion']}",
                  f"reverse:{m['reverse']}",
                  f"orient_home:{m['orient_home']}",
              ]
              if "orient_zero" in m:
                  parts.append(f"orient_zero:{m['orient_zero']}")
              return "{ " + ", ".join(parts) + " }"

          def entry_to_js(e):
              lines = ["  {"]
              lines.append(f"    name: {sq(e['name'])},")
              lines.append("    channels: [" + ", ".join(sq(c) for c in e["channels"]) + "],")
              lines.append(f"    pan_motor:  {motor(e['pan_motor'])},")
              lines.append(f"    tilt_motor: {motor(e['tilt_motor'])},")
              if e.get("color_type"):
                  lines.append(f"    color_type: {sq(e['color_type'])},")
              if e.get("color_wheel"):
                  lines.append("    color_wheel: [")
                  items = [f"{{ color:{sq(w['color'])}, dmx:{sq(str(w['dmx']))} }}"
                           for w in e["color_wheel"]]
                  for i in range(0, len(items), 3):
                      lines.append("      " + ", ".join(items[i:i+3]) + ",")
                  lines.append("    ],")
              if e.get("rgbw") is not None:
                  r = e["rgbw"]
                  lines.append(f"    rgbw: {{ red:{r['red']}, green:{r['green']}, blue:{r['blue']}, white:{r['white']} }},")
              lines.append("  },")
              return "\n".join(lines)

          HTML_FILE = "xmodel-builder.html"
          MARKER = "];\n\n\n/* ===================== State ===================== */"
          with open(HTML_FILE, encoding="utf-8") as f:
              html = f.read()

          if MARKER not in html:
              print(f"Warning: insertion marker not found in {HTML_FILE} — HTML not updated.")
          else:
              js_entry = entry_to_js(entry)
              html = html.replace(MARKER, js_entry + "\n" + MARKER, 1)
              count = len(data["moving_heads"])
              html = re.sub(r"// \d+ built-in fixture presets", f"// {count} built-in fixture presets", html)
              with open(HTML_FILE, "w", encoding="utf-8") as f:
                  f.write(html)
              print(f"Updated {HTML_FILE} BUILTIN_PRESETS")

          print(f"Added '{name}'")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("status=added\n")
              f.write(f"name={name}\n")
          EOF

      - name: Commit and push
        if: steps.merge.outputs.status == 'added'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add moving_heads_channel_types.json xmodel-builder.html
          git commit -m "feat: add '${{ steps.merge.outputs.name }}' (issue #${{ github.event.issue.number }})"
          git push

      - name: Comment and close — success
        if: steps.merge.outputs.status == 'added'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Moving Head added Automagically\n\n**${{ steps.merge.outputs.name }}** has been appended to \`moving_heads_channel_types.json\` and committed to main.`
            });
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Send email notification
        if: steps.merge.outputs.status == 'added'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: xlights.andy@kulplights.com
          from: Moving Heads Bot <${{ secrets.MAIL_USERNAME }}>
          subject: "Moving Head added Automagically: ${{ steps.merge.outputs.name }}"
          body: |
            A new moving head was added to moving_heads_channel_types.json.

            Name: ${{ steps.merge.outputs.name }}
            Issue: #${{ github.event.issue.number }} — ${{ github.event.issue.title }}
            Submitted by: ${{ github.event.issue.user.login }}

            View the issue: ${{ github.event.issue.html_url }}

      - name: Comment — duplicate
        if: steps.merge.outputs.status == 'duplicate'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `ℹ️ **${{ steps.merge.outputs.name }}** already exists in \`moving_heads_channel_types.json\` — no changes made.`
            })

      - name: Comment — parse error
        if: contains(fromJson('["no_json","bad_json","no_name"]'), steps.merge.outputs.status)
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ Could not parse a valid moving head from this issue body. Please check that the JSON block is present and correctly formatted.`
            })
